name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Submit canonical URLs to IndexNow
        env:
          INDEXNOW_KEY: 90a8a3f30f1740ff95f5bc2c04ef651a
        shell: bash
        run: |
          url_list=$(grep -oP '(?<=<loc>).*?(?=</loc>)' sitemap.xml | jq -R . | jq -s .)
          jq -n \
            --arg host "lambdaarchive.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg key_location "https://lambdaarchive.com/$INDEXNOW_KEY.txt" \
            --argjson url_list "$url_list" \
            '{host: $host, key: $key, keyLocation: $key_location, urlList: $url_list}' \
            > indexnow-payload.json

          curl --fail-with-body --retry 3 \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json \
            https://api.indexnow.org/indexnow
